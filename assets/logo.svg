<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="laserSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFAA00" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- TRADING -->
  <g id="trading-text">
    <!-- T -->
    <path d="M 60 40 L 130 40 L 130 62 L 107 62 L 107 140 L 83 140 L 83 62 L 60 62 Z" fill="#FFFFFF" />
    
    <!-- R -->
    <path d="M 155 40 L 208 40 C 225 40 236 49 236 65 C 236 78 227 86 215 89 L 238 140 L 211 140 L 191 93 L 179 93 L 179 140 L 155 140 Z M 179 59 L 179 76 L 204 76 C 211 76 215 72 215 67 C 215 62 211 59 204 59 Z" fill="#FFFFFF" />
    
    <!-- A (White Chevron Outer + Vibrant Orange Triangle Inner) -->
    <g id="letter-a">
      <!-- White outer legs -->
      <polygon points="295,40 252,140 277,140 295,96 313,140 338,140" fill="#FFFFFF" />
      <!-- Sharp Vibrant Orange Triangle in the counter/inner opening -->
      <polygon points="295,94 274,138 316,138" fill="#FF5500" filter="url(#orangeGlow)" />
    </g>

    <!-- D -->
    <path d="M 360 40 L 405 40 C 428 40 445 55 445 90 C 445 125 428 140 405 140 L 360 140 Z M 384 60 L 384 120 L 403 120 C 416 120 422 110 422 90 C 422 70 416 60 403 60 Z" fill="#FFFFFF" />

    <!-- I -->
    <rect x="468" y="40" width="24" height="100" fill="#FFFFFF" />

    <!-- N -->
    <path d="M 515 40 L 539 40 L 576 104 L 576 40 L 600 40 L 600 140 L 576 140 L 539 76 L 539 140 L 515 140 Z" fill="#FFFFFF" />

    <!-- G -->
    <path d="M 690 60 C 678 47 662 40 642 40 C 606 40 580 67 580 90 C 580 113 606 140 642 140 C 668 140 686 128 692 108 L 650 108 L 650 90 L 714 90 L 714 135 C 700 148 673 158 642 158 C 592 158 556 124 556 90 C 556 56 592 22 642 22 C 673 22 698 33 714 48 Z" fill="#FFFFFF" transform="translate(45, 0)" />
  </g>

  <!-- STUDIOS Subtext -->
  <text x="400" y="195" font-family="'Montserrat', 'Space Grotesk', sans-serif" font-size="24" font-weight="600" fill="#888888" letter-spacing="16" text-anchor="middle">STUDIOS</text>
</svg>
